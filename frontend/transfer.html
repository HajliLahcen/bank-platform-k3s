<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Platform</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        button, input, select {
            font-family: inherit;
        }

        /* LOGIN */

        #loginPage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
        }

        .login-card {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        .login-logo {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .login-subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            padding: 13px;
            outline: none;
            background: white;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .btn {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .alert {
            display: none;
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .alert.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .alert.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        /* APPLICATION */

        #appPage {
            display: none;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #111827;
            color: white;
            padding: 28px 18px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 45px;
            padding-left: 12px;
        }

        .logo span {
            color: #60a5fa;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav button {
            border: none;
            background: transparent;
            color: #9ca3af;
            padding: 13px 14px;
            text-align: left;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .nav button:hover,
        .nav button.active {
            background: #1f2937;
            color: white;
        }

        .logout {
            position: absolute;
            bottom: 30px;
            left: 18px;
            right: 18px;
        }

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 27px;
        }

        .header p {
            margin-top: 6px;
            color: #6b7280;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
        }

        .card-label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 27px;
            font-weight: 700;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 22px;
        }

        .panel {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
        }

        .panel h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: #6b7280;
            font-size: 12px;
            padding: 12px 8px;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 15px 8px;
            border-bottom: 1px solid #f0f1f3;
            font-size: 14px;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #dcfce7;
            color: #166534;
        }

        .amount {
            font-weight: 600;
        }

        @media (max-width: 1000px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 70px;
            }

            .logo {
                font-size: 0;
            }

            .logo span {
                font-size: 20px;
            }

            .nav button {
                font-size: 0;
                text-align: center;
            }

            .main {
                margin-left: 70px;
                width: calc(100% - 70px);
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

    <div class="login-card">

        <div class="login-logo">
            🏦 Bank Platform
        </div>

        <div class="login-subtitle">
            Secure banking portal
        </div>

        <div id="loginAlert" class="alert"></div>

        <form onsubmit="login(event)">

            <div class="form-group">
                <label>Username</label>
                <input
                    id="loginUsername"
                    type="text"
                    placeholder="Username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                    required
                >
            </div>

            <button class="btn" type="submit">
                Sign in
            </button>

        </form>

    </div>

</div>


<!-- APPLICATION -->

<div id="appPage">

    <div class="app">

        <aside class="sidebar">

            <div class="logo">
                🏦 <span>Bank Platform</span>
            </div>

            <nav class="nav">

                <button class="active">
                    🏠 Dashboard
                </button>

                <button onclick="scrollToTransfer()">
                    💸 Transfer
                </button>

                <button onclick="scrollToTransactions()">
                    📊 Transactions
                </button>

            </nav>

            <button
                class="nav logout"
                onclick="logout()">

                🚪 Logout

            </button>

        </aside>


        <main class="main">

            <header class="header">

                <div>
                    <h1 id="welcome">
                        Welcome 👋
                    </h1>

                    <p>
                        Here's what's happening with your account.
                    </p>
                </div>

                <div class="user">

                    <div class="avatar" id="avatar">
                        --
                    </div>

                    <div>
                        <strong id="displayUsername">
                            --
                        </strong>

                        <div style="font-size:12px;color:#6b7280;">
                            Personal Account
                        </div>
                    </div>

                </div>

            </header>


            <section class="cards">

                <div class="card">

                    <div class="card-label">
                        Total Balance
                    </div>

                    <div class="card-value" id="totalBalance">
                        Loading...
                    </div>

                </div>

                <div class="card">

                    <div class="card-label">
                        Transactions
                    </div>

                    <div class="card-value" id="transactionCount">
                        -
                    </div>

                </div>

                <div class="card">

                    <div class="card-label">
                        Account
                    </div>

                    <div class="card-value" id="accountName">
                        --
                    </div>

                </div>

            </section>


            <section class="content-grid">

                <!-- TRANSFER -->

                <div class="panel" id="transferPanel">

                    <h2>
                        Quick Transfer
                    </h2>

                    <div id="transferAlert"
                         class="alert">
                    </div>

                    <div class="form-group">

                        <label>
                            From
                        </label>

                        <input
                            id="from"
                            type="text"
                            readonly
                        >

                    </div>

                    <div class="form-group">

                        <label>
                            To
                        </label>

                        <select id="to">

                            <option value="">
                                Select account
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>
                            Amount (MAD)
                        </label>

                        <input
                            id="amount"
                            type="number"
                            min="1"
                            step="0.01"
                            placeholder="0.00"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>
                            Description
                        </label>

                        <input
                            id="description"
                            type="text"
                            placeholder="Payment..."
                        >

                    </div>

                    <button
                        class="btn"
                        onclick="makeTransfer()">

                        Send Money

                    </button>

                </div>


                <!-- TRANSACTIONS -->

                <div
                    class="panel"
                    id="transactionsPanel">

                    <h2>
                        Recent Transactions
                    </h2>

                    <table>

                        <thead>

                            <tr>
                                <th>Reference</th>
                                <th>From</th>
                                <th>To</th>
                                <th>Amount</th>
                                <th>Status</th>
                            </tr>

                        </thead>

                        <tbody id="transactions">

                            <tr>
                                <td colspan="5">
                                    Loading...
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

</div>


<script>

const API = "";


/* =========================
   AUTH
========================= */

function getToken() {

    return localStorage.getItem(
        "bank_token"
    );

}


function getUser() {

    const user =
        localStorage.getItem(
            "bank_user"
        );

    return user
        ? JSON.parse(user)
        : null;

}


/* =========================
   LOGIN
========================= */

async function login(event) {

    event.preventDefault();

    const username =
        document.getElementById(
            "loginUsername"
        ).value;

    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    try {

        const response =
            await fetch(
                API + "/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Invalid credentials"
            );

        }


        localStorage.setItem(
            "bank_token",
            data.access_token
        );

        localStorage.setItem(
            "bank_user",
            JSON.stringify(data.user)
        );


        showDashboard();

    }
    catch (error) {

        showLoginAlert(
            error.message,
            "error"
        );

    }

}


/* =========================
   AUTHENTICATED FETCH
========================= */

async function apiFetch(
    url,
    options = {}
) {

    const token =
        getToken();


    options.headers = {
        ...(options.headers || {}),
        "Authorization":
            "Bearer " + token,
        "Content-Type":
            "application/json"
    };


    const response =
        await fetch(
            API + url,
            options
        );


    if (response.status === 401) {

        logout();

        throw new Error(
            "Session expired"
        );

    }


    return response;

}


/* =========================
   SHOW DASHBOARD
========================= */

function showDashboard() {

    const user =
        getUser();


    if (!user) {

        logout();

        return;

    }


    document.getElementById(
        "loginPage"
    ).style.display = "none";


    document.getElementById(
        "appPage"
    ).style.display = "block";


    const username =
        user.username;


    document.getElementById(
        "welcome"
    ).textContent =
        "Welcome, " +
        username +
        " 👋";


    document.getElementById(
        "displayUsername"
    ).textContent =
        username;


    document.getElementById(
        "accountName"
    ).textContent =
        username;


    document.getElementById(
        "from"
    ).value =
        username;


    document.getElementById(
        "avatar"
    ).textContent =
        username
            .substring(0, 2)
            .toUpperCase();


    loadAccounts();

    loadTransactions();

}


/* =========================
   LOAD ACCOUNTS
========================= */

async function loadAccounts() {

    try {

        /*
         * /accounts now returns ONLY the
         * authenticated user's account.
         */

        const accountResponse =
            await apiFetch(
                "/accounts"
            );

        const currentAccount =
            await accountResponse.json();


        /*
         * Update dashboard balance.
         */

        if (accountResponse.ok) {

            document.getElementById(
                "totalBalance"
            ).textContent =
                Number(
                    currentAccount.balance
                ).toLocaleString(
                    "en-US"
                ) + " MAD";

        }


        /*
         * Load transfer beneficiaries.
         *
         * IMPORTANT:
         * This endpoint returns usernames only.
         * No balances are exposed.
         */

        const beneficiaryResponse =
            await apiFetch(
                "/beneficiaries"
            );

        const beneficiaries =
            await beneficiaryResponse.json();


        const select =
            document.getElementById(
                "to"
            );


        select.innerHTML =
            '<option value="">Select account</option>';


        beneficiaries.forEach(
            beneficiary => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    beneficiary.username;

                option.textContent =
                    beneficiary.username;

                select.appendChild(
                    option
                );

            }
        );

    }
    catch (error) {

        console.error(
            "Accounts error:",
            error
        );

    }

}



/* =========================
   LOAD TRANSACTIONS
========================= */

async function loadTransactions() {

    try {

        const user =
            getUser();


        const response =
            await apiFetch(
                "/transactions/" +
                encodeURIComponent(
                    user.username
                )
            );


        const transactions =
            await response.json();


        document.getElementById(
            "transactionCount"
        ).textContent =
            transactions.length;


        const tbody =
            document.getElementById(
                "transactions"
            );


        tbody.innerHTML = "";


        transactions
            .slice(0, 8)
            .forEach(
                transaction => {

                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>
                            ${transaction.reference
                                ? transaction.reference
                                    .substring(0, 8)
                                : "-"}
                        </td>

                        <td>
                            ${transaction.from_account}
                        </td>

                        <td>
                            ${transaction.to_account}
                        </td>

                        <td class="amount">
                            ${Number(
                                transaction.amount
                            ).toLocaleString(
                                "en-US"
                            )} MAD
                        </td>

                        <td>
                            <span class="status">
                                ${transaction.status}
                            </span>
                        </td>

                    `;


                    tbody.appendChild(
                        row
                    );

                }
            );

    }
    catch (error) {

        console.error(
            "Transactions error:",
            error
        );

    }

}


/* =========================
   TRANSFER
========================= */

async function makeTransfer() {

    const to =
        document.getElementById(
            "to"
        ).value;


    const amount =
        document.getElementById(
            "amount"
        ).value;


    const description =
        document.getElementById(
            "description"
        ).value;


    if (!to || !amount) {

        showTransferAlert(
            "Please select an account and enter an amount.",
            "error"
        );

        return;

    }


    try {

        const response =
            await apiFetch(
                "/transfer",
                {
                    method: "POST",

                    body: JSON.stringify({

                        to,

                        amount:
                            Number(amount),

                        description

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Transfer failed"
            );

        }


        showTransferAlert(
            "Transfer successful!",
            "success"
        );


        document.getElementById(
            "amount"
        ).value = "";


        document.getElementById(
            "description"
        ).value = "";


        await loadAccounts();

        await loadTransactions();

    }
    catch (error) {

        showTransferAlert(
            error.message,
            "error"
        );

    }

}


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "bank_token"
    );

    localStorage.removeItem(
        "bank_user"
    );


    document.getElementById(
        "appPage"
    ).style.display = "none";


    document.getElementById(
        "loginPage"
    ).style.display = "flex";

}


/* =========================
   ALERTS
========================= */

function showLoginAlert(
    message,
    type
) {

    const alert =
        document.getElementById(
            "loginAlert"
        );


    alert.textContent =
        message;


    alert.className =
        "alert " + type;

}


function showTransferAlert(
    message,
    type
) {

    const alert =
        document.getElementById(
            "transferAlert"
        );


    alert.textContent =
        message;


    alert.className =
        "alert " + type;

}


/* =========================
   NAVIGATION
========================= */

function scrollToTransfer() {

    document
        .getElementById(
            "transferPanel"
        )
        .scrollIntoView({
            behavior: "smooth"
        });

}


function scrollToTransactions() {

    document
        .getElementById(
            "transactionsPanel"
        )
        .scrollIntoView({
            behavior: "smooth"
        });

}


/* =========================
   INITIALIZATION
========================= */

if (getToken() && getUser()) {

    showDashboard();

}

</script>

</body>
</html>
